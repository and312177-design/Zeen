<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نظام الكافيه</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    direction:rtl;
    background:#f5f1ec;
    color:#333;
    text-align:center;
}

h1{color:#6f4522;font-size:32px;margin:20px 10px}
h2{color:#6f4522;margin-top:5px}

button{
    border:0;
    cursor:pointer;
    font-family:Arial,sans-serif;
}

.hidden{display:none!important}

/* الرئيسية */

.home{
    padding-top:30px;
}

.home h1{
    font-size:40px;
}

.home p{
    color:#8b5a2b;
    font-size:20px;
}

.buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    margin-top:50px;
}

.buttons button{
    width:145px;
    height:145px;
    background:linear-gradient(145deg,#8b5a2b,#6f4522);
    color:white;
    border-radius:22px;
    font-size:23px;
    font-weight:bold;
    box-shadow:0 8px 18px rgba(80,50,20,.2);
}

.buttons button:active{
    transform:scale(.95);
}

/* زر الرجوع */

.back-btn{
    position:absolute;
    top:15px;
    left:15px;
    background:#6f4522;
    color:white;
    padding:10px 16px;
    border-radius:12px;
    font-size:15px;
    font-weight:bold;
}

/* الترابيزات */

.tables{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    padding:10px;
}

.table-box{
    width:85px;
    height:85px;
    background:linear-gradient(145deg,#8b5a2b,#6f4522);
    color:white;
    margin:8px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    font-weight:bold;
    box-shadow:0 5px 12px rgba(80,50,20,.2);
    transition:.2s;
    position:relative;
}

.table-box:active{
    transform:scale(.93);
}

.table-box.occupied{
    background:linear-gradient(145deg,#d99a32,#b87518)!important;
    box-shadow:
    0 0 8px rgba(217,154,50,.7),
    0 0 18px rgba(217,154,50,.45);
    transform:scale(1.04);
    border:2px solid #f3c56b;
}

.table-box.occupied::after{
    content:"●";
    position:absolute;
    top:5px;
    right:7px;
    font-size:10px;
    color:#fff3c4;
}

/* البحث */

#search{
    width:90%;
    max-width:600px;
    padding:14px 18px;
    border-radius:15px;
    border:2px solid #e2d8cc;
    background:white;
    font-size:17px;
    margin:10px auto 15px;
    outline:none;
}

#search:focus{
    border-color:#8b5a2b;
}

/* الأوردر */

.container{
    display:flex;
    gap:18px;
    padding:15px;
    max-width:1400px;
    margin:auto;
    align-items:flex-start;
}

.menu-box,
.order-box{
    background:white;
    padding:18px;
    border-radius:20px;
    flex:1;
    box-shadow:0 6px 20px rgba(80,50,20,.10);
    border:1px solid #eee;
    min-width:0;
}

/* التصنيفات */

#categories{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin:12px 0 18px;
}

#categories button{
    background:#eee5dc;
    color:#6f4522;
    border-radius:12px;
    padding:10px 14px;
    font-size:14px;
    font-weight:bold;
}

#categories button.active{
    background:#8b5a2b;
    color:white;
    transform:scale(1.04);
}

/* المنيو */

#menu{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
}

.item{
    background:linear-gradient(145deg,#936237,#75491f);
    color:white;
    padding:7px 3px;
    border-radius:11px;
    font-size:11px;
    font-weight:bold;
    min-height:65px;
    box-shadow:0 4px 8px rgba(80,50,20,.15);
    line-height:1.4;
    word-break:break-word;
}

.item:active{
    transform:scale(.93);
}

/* الأوردر */

#orders{
    list-style:none;
    padding:0;
    margin:10px 0;
    text-align:right;
}

#orders li{
    background:#faf7f3;
    margin:10px 0;
    padding:13px;
    border-radius:15px;
    border-right:4px solid #8b5a2b;
    line-height:1.7;
}

#orders li b:first-child{
    color:#6f4522;
    font-size:16px;
}

#orders button{
    background:#8b5a2b;
    color:white;
    margin:3px;
    padding:6px 10px;
    border-radius:9px;
    font-weight:bold;
    font-size:13px;
}

#orders li span{
    display:inline-block;
    background:#eee5dc;
    color:#6f4522;
    padding:3px 8px;
    border-radius:8px;
    margin-top:3px;
    font-size:13px;
}

#orderTimer{
    background:#fff4e6;
    color:#8b5a2b;
    border-radius:12px;
    padding:9px;
    margin:10px 0;
    font-weight:bold;
    font-size:15px;
    border:1px solid #f0dcc5;
}

/* الملاحظات */

#notes{
    width:100%;
    resize:vertical;
    border:2px solid #eee0d1;
    border-radius:13px;
    padding:12px;
    font-family:Arial,sans-serif;
    font-size:15px;
    outline:none;
}

#notes:focus{
    border-color:#8b5a2b;
}

/* الإجمالي */

#total{
    background:linear-gradient(145deg,#8b5a2b,#6f4522);
    color:white;
    padding:14px;
    border-radius:15px;
    font-size:21px;
    margin-top:15px;
}

/* إخلاء */

.clear-btn{
    background:#b23b3b;
    color:white;
    padding:11px 18px;
    border-radius:12px;
    font-size:15px;
    font-weight:bold;
    width:100%;
    margin-top:10px;
}

/* النوافذ */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:99999;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.modal-box{
    background:white;
    padding:25px;
    border-radius:20px;
    width:85%;
    max-width:350px;
    text-align:center;
}

.modal-box button{
    padding:10px 20px;
    border-radius:10px;
    margin:5px;
    font-weight:bold;
}

/* الإضافات */

.addons-box{
    width:100%;
    max-width:430px;
    max-height:85vh;
    overflow-y:auto;
    background:#fff;
    border-radius:22px;
    padding:20px;
    text-align:right;
}

.addons-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #eee;
    padding-bottom:10px;
}

.addons-close{
    background:#eee;
    color:#555;
    border-radius:50%;
    width:38px;
    height:38px;
    font-size:18px;
}

.addons-box h3{
    color:#6f4522;
    background:#f5eee7;
    padding:9px;
    border-radius:10px;
    margin:15px 0 8px;
}

.addons-box label{
    display:flex;
    align-items:center;
    background:#faf8f5;
    border:1px solid #eee3d8;
    margin:7px 0;
    padding:11px;
    border-radius:12px;
    font-size:15px;
}

.addons-box input{
    width:19px;
    height:19px;
    margin-left:9px;
    accent-color:#8b5a2b;
}

.addons-total{
    background:#fff4e6;
    color:#6f4522;
    padding:12px;
    border-radius:12px;
    margin-top:12px;
    font-weight:bold;
    text-align:center;
}

.addons-buttons{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.addons-buttons button{
    flex:1;
    padding:13px;
    font-size:16px;
    font-weight:bold;
    border-radius:12px;
}

.addons-save{
    background:#8b5a2b;
    color:white;
}

.addons-cancel{
    background:#eee;
    color:#555;
}

/* الشكر */

#thankYouModal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:999999;
    justify-content:center;
    align-items:center;
}

.thank-you-box{
    width:85%;
    max-width:360px;
    padding:30px 20px;
    background:linear-gradient(145deg,#fffaf3,#f3dfc2);
    border:2px solid #d4a04a;
    border-radius:25px;
    text-align:center;
    animation:thankPop .4s ease;
}

.thank-icon{
    font-size:55px;
}

.thank-you-box h2{
    color:#70451f;
    font-size:28px;
}

.thank-you-box p{
    color:#8b6a4a;
    font-size:17px;
}

@keyframes thankPop{
    from{transform:scale(.6);opacity:0}
    to{transform:scale(1);opacity:1}

/* موبايل */

@media(max-width:800px){
    .container{
        flex-direction:column;
        padding:10px;
    }

    .menu-box,
    .order-box{
        width:100%;
    }

    #menu{
        grid-template-columns:repeat(4,1fr);
        gap:6px;
    }
}

@media(max-width:480px){

    }

    .item{

    }

    #categories{

    }

    #categories button{

        padding:8px 9px;
    }

    .menu-box,
    .order-box{
        padding:12px;
    }

    .table-box{
        width:75px;
        height:75px;
        font-size:19px;
    }
}
</style>

    {name:"تشيز كيك",price:25,category:"آيس كريم"},
    {name:"لوتس",price:25,category:"آيس كريم"},
    {name:"مستكة",price:25,category:"آيس كريم"},
    {name:"أوريو",price:25,category:"آيس كريم"},
    {name:"نوتيلا",price:25,category:"آيس كريم"},
    {name:"لبان",price:25,category:"آيس كريم"},
    {name:"فستق",price:35,category:"آيس كريم"}

];


/* =====================================================
   حالة البرنامج
===================================================== */

let currentSection = null;
let currentTable = null;
let currentOrder = null;
let selectedItem = -1;


/* =====================================================
   الرئيسية
===================================================== */

function openSection(section){

    currentSection = section;

    document.getElementById("homePage")
        .classList.add("hidden");

    document.getElementById("orderPage")
        .classList.add("hidden");

    document.getElementById("tablesPage")
        .classList.remove("hidden");

    document.getElementById("sectionTitle").innerText =
        "ترابيزات " + section;

    renderTables();

}


/* =====================================================
   إنشاء الترابيزات
===================================================== */

function renderTables(){

    let box = document.getElementById("tables");

    box.innerHTML = "";

    for(let i=1;i<=15;i++){

        let name = currentSection + i;

        let table = document.createElement("div");

        table.className = "table-box";

        table.innerText = name;

        let saved = localStorage.getItem(name);

        if(saved){

            try{

                let data = JSON.parse(saved);

                if(data.items && data.items.length > 0){
                    table.classList.add("occupied");
                }

            }catch(e){}

        }

        table.onclick = function(){
            openTable(name);
        };

        box.appendChild(table);
    }
}


/* =====================================================
   تحديث الترابيزات
===================================================== */

function updateTables(){

    if(currentSection){
        renderTables();
    }

}


/* =====================================================
   فتح الترابيزة
===================================================== */

function openTable(name){

    currentTable = name;

    let saved = localStorage.getItem(name);

    if(saved){

        try{

            currentOrder = JSON.parse(saved);

        }catch(e){

            currentOrder = {
                items:[],
                startTime:null,
                notes:""
            };

        }

    }else{

        currentOrder = {
            items:[],
            startTime:null,
            notes:""
        };

    }

    document.getElementById("tablesPage")
        .classList.add("hidden");

    document.getElementById("homePage")
        .classList.add("hidden");

    document.getElementById("orderPage")
        .classList.remove("hidden");

    document.getElementById("tableName").innerText =
        "🪑 ترابيزة " + name;

    document.getElementById("search").value = "";

    document.getElementById("notes").value =
        currentOrder.notes || "";

    showCategory("الكل");
    showOrders();
    updateTimer();

}


/* =====================================================
   الرجوع للرئيسية
===================================================== */

function goHome(){

    currentSection = null;
    currentTable = null;

    document.getElementById("tablesPage")
        .classList.add("hidden");

    document.getElementById("orderPage")
        .classList.add("hidden");

    document.getElementById("homePage")
        .classList.remove("hidden");

}


/* =====================================================
   الرجوع للترابيزات
===================================================== */

function backToTables(){

    currentTable = null;

    document.getElementById("orderPage")
        .classList.add("hidden");

    document.getElementById("tablesPage")
        .classList.remove("hidden");

    renderTables();

}


/* =====================================================
   حفظ الأوردر
===================================================== */

function saveOrder(){

    if(!currentTable || !currentOrder) return;

    localStorage.setItem(
        currentTable,
        JSON.stringify(currentOrder)
    );

    updateTables();

}


/* =====================================================
   إضافة صنف
===================================================== */

function addOrder(name,price){

    if(!currentOrder.startTime){
        currentOrder.startTime = Date.now();
    }

    let found = currentOrder.items.find(
        item => item.name === name
    );

    if(found){

        found.qty++;

    }else{

        currentOrder.items.push({

            name:name,
            price:Number(price),
            qty:1,
            addons:[],
            iceCream:[]

        });

    }

    saveOrder();
    showOrders();
    updateTimer();

}


/* =====================================================
   عرض المنيو
===================================================== */

function showMenu(list){

    let box = document.getElementById("menu");

    box.innerHTML = "";

    if(!list || list.length === 0){

        box.innerHTML =
            "<p>لا توجد أصناف</p>";

        return;
    }

    list.forEach(function(item){

        let btn = document.createElement("button");

        btn.className = "item";

        btn.innerHTML =
            item.name +
            "<br>" +
            item.price +
            " ج";

        btn.onclick = function(){

            addOrder(
                item.name,
                item.price
            );

        };

        box.appendChild(btn);

    });

}


/* =====================================================
   البحث
===================================================== */

function searchMenu(){

    let text =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    let result = menu.filter(function(item){

        return item.name
            .toLowerCase()
            .includes(text);

    });

    showMenu(result);

}


/* =====================================================
   التصنيفات
===================================================== */

function showCategory(category){

    let buttons =
        document.querySelectorAll(
            "#categories button"
        );

    buttons.forEach(function(btn){

        btn.classList.remove("active");

        if(btn.innerText.includes(category)){
            btn.classList.add("active");
        }

    });

    document.getElementById("search").value = "";

    if(category === "الكل"){

        showMenu(menu);

    }else{

        showMenu(
            menu.filter(
                item => item.category === category
            )
        );

    }

}


/* =====================================================
   عرض الأوردر
===================================================== */

function showOrders(){

    let box = document.getElementById("orders");

    box.innerHTML = "";

    let total = 0;

    if(!currentOrder) return;

    currentOrder.items.forEach(function(item,index){

        let addonsTotal = 0;

        if(item.addons){

            item.addons.forEach(function(add){
                addonsTotal += Number(add.price);
            });

        }

        let iceCreamTotal = 0;

        if(item.iceCream){

            item.iceCream.forEach(function(ice){
                iceCreamTotal += Number(ice.price);
            });

        }

        let singlePrice =
            Number(item.price) +
            addonsTotal +
            iceCreamTotal;

        let itemTotal =
            singlePrice * item.qty;

        total += itemTotal;


        let addonsText = "";

        if(item.addons && item.addons.length){

            addonsText =
                "<br><span>➕ " +
                item.addons
                    .map(add => add.name)
                    .join(" + ") +
                "</span>";

        }


        let iceCreamText = "";

        if(item.iceCream && item.iceCream.length){

            iceCreamText =
                "<br><span>🍨 آيس كريم: " +
                item.iceCream
                    .map(ice => ice.name)
                    .join(" + ") +
                "</span>";

        }


        let li = document.createElement("li");

        li.innerHTML =

            "<b>" +
            item.name +
            "</b>" +

            addonsText +

            iceCreamText +

            "<br>" +

            "العدد: " +
            item.qty +

            " <button onclick='changeQty(" +
            index +
            ",1)'>+</button>" +

            " <button onclick='changeQty(" +
            index +
            ",-1)'>-</button>" +

            " <button onclick='openAddons(" +
            index +
            ")'>➕ إضافات</button>" +

            "<br><b>" +
            itemTotal +
            " جنيه</b>";

        box.appendChild(li);

    });


    document.getElementById("total").innerHTML =
        "الإجمالي: " + total + " جنيه";

}


/* =====================================================
   تغيير الكمية
===================================================== */

function changeQty(index,value){

    if(!currentOrder.items[index]) return;

    currentOrder.items[index].qty += value;

    if(currentOrder.items[index].qty <= 0){

        currentOrder.items.splice(index,1);

    }

    saveOrder();
    showOrders();

}


/* =====================================================
   الملاحظات
===================================================== */

function saveNotes(){

    let notes =
        document.getElementById("notes");

    if(!notes || !currentOrder) return;

    currentOrder.notes = notes.value;

    saveOrder();

}


/* =====================================================
   التايمر
===================================================== */

function updateTimer(){

    let timer =
        document.getElementById("orderTimer");

    if(!timer || !currentOrder) return;

    if(currentOrder.startTime){

        let diff =
            Date.now() -
            currentOrder.startTime;

        let min =
            Math.floor(diff / 60000);

        let sec =
            Math.floor(
                (diff % 60000) / 1000
            );

        timer.innerHTML =
            "⏱️ بقاله: " +
            min +
            " دقيقة " +
            sec +
            " ثانية";

    }else{

        timer.innerHTML =
            "⏱️ لم يبدأ الأوردر بعد";

    }

}


/* =====================================================
   إخلاء الترابيزة
===================================================== */

function clearTable(){

    document.getElementById(
        "clearTableModal"
    ).style.display = "flex";

}


function closeClearTable(){

    document.getElementById(
        "clearTableModal"
    ).style.display = "none";

}


function confirmClearTable(){

    localStorage.removeItem(currentTable);

    closeClearTable();

    document.getElementById(
        "thankYouModal"
    ).style.display = "flex";

    setTimeout(function(){

        document.getElementById(
            "thankYouModal"
        ).style.display = "none";

        backToTables();

    },1500);

}


/* =====================================================
   الإضافات
===================================================== */

function openAddons(index){

    selectedItem = index;

    let modal =
        document.getElementById("addonsModal");

    let list =
        document.getElementById("addonsList");

    list.innerHTML = "";

    let title =
        document.createElement("h3");

    title.innerText = "➕ الإضافات";

    list.appendChild(title);


    addons.forEach(function(add){

        let label =
            document.createElement("label");

        let checked = "";

        if(
            currentOrder.items[index].addons &&
            currentOrder.items[index].addons.some(
                old => old.name === add.name
            )
        ){

            checked = "checked";

        }

        label.innerHTML =

            "<input type='checkbox' " +
            "class='normal-addon' " +
            "value='" +
            add.name +
            "' " +
            "data-price='" +
            add.price +
            "' " +
            checked +
            "> " +

            add.name +
            " (+" +
            add.price +
            " ج)";

        list.appendChild(label);

    });


    let iceTitle =
        document.createElement("h3");

    iceTitle.innerText =
        "🍨 آيس كريم";

    list.appendChild(iceTitle);


    iceCream.forEach(function(ice){

        let label =
            document.createElement("label");

        let checked = "";

        if(
            currentOrder.items[index].iceCream &&
            currentOrder.items[index].iceCream.some(
                old => old.name === ice.name
            )
        ){

            checked = "checked";

        }

        label.innerHTML =

            "<input type='checkbox' " +
            "class='ice-cream-addon' " +
            "value='" +
            ice.name +
            "' " +
            "data-price='" +
            ice.price +
            "' " +
            checked +
            "> " +

            ice.name +
            " (+" +
            ice.price +
            " ج)";

        list.appendChild(label);

    });


    updateAddonsTotal();

    modal.style.display = "flex";

}


function updateAddonsTotal(){

    let total = 0;

    document.querySelectorAll(
        "#addonsList input:checked"
    ).forEach(function(input){

        total += Number(
            input.dataset.price
        );

    });

    document.getElementById(
        "addonsTotal"
    ).innerText = total;

}


document.addEventListener(
    "change",
    function(e){

        if(
            e.target &&
            e.target.matches(
                "#addonsList input"
            )
        ){

            updateAddonsTotal();

        }

    }
);


function closeAddons(){

    document.getElementById(
        "addonsModal"
    ).style.display = "none";

}


function saveAddons(){

    if(
        selectedItem < 0 ||
        !currentOrder.items[selectedItem]
    ){

        closeAddons();
        return;

    }

    let checked =
        document.querySelectorAll(
            "#addonsList input:checked"
        );

    let normalAddons = [];
    let selectedIceCream = [];

    checked.forEach(function(input){

        let data = {

            name:input.value,
            price:Number(input.dataset.price)

        };

        if(
            input.classList.contains(
                "ice-cream-addon"
            )
        ){

            selectedIceCream.push(data);

        }else{

            normalAddons.push(data);

        }

    });


    currentOrder.items[selectedItem].addons =
        normalAddons;

    currentOrder.items[selectedItem].iceCream =
        selectedIceCream;

    saveOrder();

    showOrders();

    closeAddons();

}


/* =====================================================
   تحديث كل ثانية
===================================================== */

setInterval(function(){

    updateTimer();

    updateTables();

},1000);


/* =====================================================
   تشغيل
===================================================== */

goHome();

</script>

</body>
</html>
